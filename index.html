<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OurSpace - Production Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log("SW Skip"));
      }
    </script>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <style>
        /* CORE RESET & DARK THEMING */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f111a 0%, #161925 50%, #0d0f17 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #f1f3f9; overflow-x: hidden;
        }
        .main-btn, input, .nav-icons span, .glass-box, .post-grid-item, textarea { transition: all 0.25s ease; }

        /* AUTHENTICATION MODULES */
        .auth-container { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 100vh; padding: 20px; position: relative; z-index: 1000; }
        .glass-box { background-color: rgba(255, 255, 255, 0.04); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6); padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 360px; text-align: center; display: none; }
        .logo { font-size: 2.6em; font-weight: 800; margin-bottom: 25px; background: linear-gradient(45deg, #ff758c, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 16px; background-color: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; color: #fff; font-size: 14px; font-family: inherit; }
        input:focus, textarea:focus { outline: none; background-color: rgba(255, 255, 255, 0.08); border-color: rgba(0, 149, 246, 0.5); }
        .widget-trigger-btn { display: block; width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.25); border-radius: 12px; cursor: pointer; margin-bottom: 16px; font-size: 14px; text-align: center; color: #0095f6; font-weight: bold; }
        button.main-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #0095f6 0%, #0072b1 100%); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; }
        button.main-btn:disabled { background: #333 !important; color: #777 !important; cursor: not-allowed; }
        .divider { display: flex; align-items: center; margin: 20px 0; color: rgba(255, 255, 255, 0.3); font-size: 13px; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .divider::before { margin-right: 12px; } .divider::after { margin-left: 12px; }
        .switch-link { color: #0095f6; cursor: pointer; font-weight: bold; }

        /* MAIN APP STRUCTURE */
        #appScreen { display: none; width: 100%; height: 100vh; flex-direction: column; position: fixed; top: 0; left: 0; background: #0f111a; z-index: 100; }
        .content-area { flex: 1; padding: 25px 15px 40px 15px; overflow-y: auto; width: 100%; display: flex; flex-direction: column; align-items: center; }
        #feedView { text-align: center; width: 100%; max-width: 420px; }
        .post { background: #000000; border: 1px solid rgba(255, 255, 255, 0.08); padding: 0; border-radius: 24px; width: 100%; margin: 0 auto 25px auto; text-align: left; box-shadow: 0 15px 35px rgba(0,0,0,0.5); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .post-video-container { width: 100%; position: relative; background: #000; aspect-ratio: 9 / 14; cursor: pointer; overflow: hidden; }
        .post video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .video-status-toast { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(0, 0, 0, 0.65); color: white; padding: 15px; border-radius: 50%; font-size: 24px; opacity: 0; pointer-events: none; transition: all 0.2s ease; z-index: 50; }
        .video-status-toast.show-toast { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* REELS (SPACE VIEW) */
        #reelsSpaceView { display: none; width: 100%; max-width: 420px; height: calc(100vh - 180px); margin: 0 auto; position: relative; background: #000; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .reel-video-wrapper { width: 100%; height: 100%; position: relative; background: #000; }
        .reel-video-wrapper video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .reel-overlay-info { position: absolute; bottom: 20px; left: 15px; right: 15px; z-index: 50; text-shadow: 0 2px 8px rgba(0,0,0,0.9); text-align: left; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); padding: 10px; border-radius: 12px; }
        .reel-overlay-info b { font-size: 15px; color: #0095f6; display: block; margin-bottom: 4px; } 
        .reel-overlay-info p { font-size: 13.5px; color: #fff; line-height: 1.4; }

        /* TABS LAYOUTS */
        #searchViewTab { display: none; width: 100%; max-width: 450px; text-align: center; }
        .search-container-wrapper { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; }
        .search-container-wrapper input { margin-bottom: 0; padding: 12px; }
        #profileView { display: none; width: 100%; max-width: 650px; margin: 0 auto; }
        .profile-header { display: flex; align-items: center; gap: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 20px; width: 100%; }
        .profile-pic-container { width: 95px; height: 95px; border-radius: 50%; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); display: flex; justify-content: center; align-items: center; padding: 2px; flex-shrink: 0; }
        .inner-pic { width: 100%; height: 100%; background: #1a1d29; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2em; }
        .profile-details { flex: 1; min-width: 0; }
        .profile-details h2 { margin: 0; font-size: 1.5em; display: inline-block; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
        .profile-stats { display: flex; gap: 20px; margin: 10px 0; font-size: 13.5px; flex-wrap: wrap; } 
        .profile-stats b { color: #0095f6; }
        .profile-bio { font-size: 13px; color: rgba(255, 255, 255, 0.75); line-height: 1.4; word-wrap: break-word; }
        .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; }
        .post-grid-item { background: rgba(0, 0, 0, 0.3); aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; cursor: pointer; }
        .post-grid-item video { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; pointer-events: none; }
        .no-posts-alert { grid-column: 1 / -1; text-align: center; color: rgba(255,255,255,0.3); padding: 35px 0; font-size: 13.5px; }
        .action-inline-btn { margin-left: 8px; padding: 5px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: white; cursor: pointer; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 99999 !important; padding: 15px; }
        .modal-card { background: #141622; border: 1px solid rgba(255,255,255,0.1); padding: 25px 20px; border-radius: 20px; width: 100%; max-width: 340px; text-align: center; }

        /* RESPONSIVE DESIGN SHIFTERS */
        @media screen and (min-width: 769px) {
            .top-nav { background: rgba(14, 16, 25, 0.95); backdrop-filter: blur(20px); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); width: 100%; flex-shrink: 0; }
            .nav-logo { font-size: 1.6em; font-weight: 800; cursor: pointer; color: #fff; }
            .nav-icons { display: flex; gap: 8px; align-items: center; }
            .nav-icons span { font-size: 13px; cursor: pointer; display: inline-block; padding: 8px 16px; border-radius: 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; }
            .nav-icons span:hover { color: #fff; background: rgba(0, 149, 246, 0.15); border-color: rgba(0, 149, 246, 0.35); }
        }
        @media screen and (max-width: 768px) {
            .top-nav { padding: 14px 20px; justify-content: center; }
            .nav-logo { font-size: 1.4em; }
            .nav-icons { position: fixed !important; bottom: 0 !important; left: 0 !important; width: 100% !important; background: rgba(10, 12, 18, 0.98) !important; backdrop-filter: blur(30px) !important; border-top: 1px solid rgba(255, 255, 255, 0.08) !important; padding: 10px 8px 12px 8px !important; display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 8px 6px !important; z-index: 9999 !important; }
            .nav-icons span { padding: 10px 4px !important; font-size: 12px !important; font-weight: 600 !important; background: rgba(255, 255, 255, 0.04) !important; border: 1px solid rgba(255, 255, 255, 0.06) !important; border-radius: 12px !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; text-align: center !important; color: rgba(255, 255, 255, 0.85); }
            .nav-icons span:hover { background: rgba(0, 149, 246, 0.15) !important; color: #fff !important; }
            .nav-icons span:last-child { grid-column: span 2 !important; background: rgba(255, 85, 85, 0.1) !important; border-color: rgba(255, 85, 85, 0.2) !important; }
            .content-area { padding-bottom: 125px; } 
            #reelsSpaceView { height: calc(100vh - 210px); }
            .profile-header { flex-direction: column; text-align: center; gap: 15px; }
            .profile-stats { justify-content: center; }
            .action-inline-btn { margin-left: 0; margin-top: 8px; display: block; width: 100%; max-width: 160px; margin-inline: auto; }
        }
    </style>
</head>
<body>

    <div class="auth-container" id="authZoneWrapper">
        <div class="glass-box" id="loginBox">
            <div class="logo">OurSpace</div>
            <form onsubmit="handleLogin(event)">
                <input type="email" id="loginEmail" placeholder="Apna Email dalein" required>
                <input type="password" id="loginPass" placeholder="Password dalein" required>
                <button type="submit" class="main-btn">Log In</button>
            </form>
            <div class="divider">YA</div>
            <div><span>Account nahi hai?</span> <span class="switch-link" onclick="toggleView('signupBox')">Sign up</span></div>
        </div>

        <div class="glass-box" id="signupBox">
            <div class="logo">OurSpace</div>
            <form onsubmit="handleSignup(event)">
                <input type="text" id="signUser" placeholder="Unique Username chunein" required>
                <input type="email" id="signEmail" placeholder="Private Email dalein" required>
                <input type="password" id="signPass" placeholder="Secure Password banayein" required>
                <button type="submit" class="main-btn">Create Account</button>
            </form>
            <div class="divider">YA</div>
            <div><span>Pehle se account hai?</span> <span class="switch-link" onclick="toggleView('loginBox')">Log In</span></div>
        </div>
    </div>

    <div id="appScreen">
        <div class="top-nav">
            <div class="nav-logo" onclick="showFeed()">OurSpace ✨</div>
            <div class="nav-icons">
                <span onclick="showFeed()">🏠 Home</span>
                <span onclick="showSearchViewTab()" style="color:#0095f6;">🔍 Search</span>
                <span onclick="showSpaceReels()" style="background: linear-gradient(45deg, #ff758c, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">▶️ Space</span>
                <span onclick="openModal('postModal')">➕ Post</span>
                <span onclick="viewMyOwnProfile()">👤 Profile</span>
                <span style="color: #ff5555;" onclick="logout()">Logout</span>
            </div>
        </div>
        
        <div class="content-area">
            <div id="feedView"><div id="dynamicFeedContainer"></div></div>

            <div id="searchViewTab">
                <h2>Search OurSpace Registry 🔍</h2><br>
                <div class="search-container-wrapper">
                    <input type="text" id="standaloneSearchInput" placeholder="Enter unique username...">
                    <button class="main-btn" onclick="executeStandaloneUserSearch()" style="width:100px; padding:0;">Search</button>
                </div>
                <div id="searchResultFeedback"></div>
            </div>

            <div id="reelsSpaceView">
                <div class="reel-video-wrapper" id="reelVideoPlayerContainer"></div>
            </div>

            <div id="profileView">
                <div class="profile-header">
                    <div class="profile-pic-container"><div class="inner-pic">👤</div></div>
                    <div class="profile-details">
                        <div>
                            <h2 id="profUsername">@user</h2>
                            <button class="action-inline-btn" id="profileActionBtn" onclick="openEditProfileModal()">Edit Bio</button>
                        </div>
                        <div class="profile-bio" style="margin-top:10px;">
                            <span id="profBioText">Welcome to my space.</span>
                        </div>
                    </div>
                </div>
                <div class="profile-grid" id="dynamicGridContainer"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="postModal">
        <div class="modal-card">
            <h3>Naya Post Create Karein ➕</h3><br>
            <textarea id="postContentInput" rows="3" placeholder="Kuch badhiya caption likho..." style="font-family: inherit; resize: none;"></textarea>
            
            <div class="widget-trigger-btn" id="uploadWidgetTrigger" onclick="openCloudinaryUploadWidget()">🎥 Select Video From Gallery</div>
            
            <button class="main-btn" id="publishBtn" onclick="addNewPost()">Publish</button><br><br>
            <span class="switch-link" onclick="closeModal('postModal')">Cancel</span>
        </div>
    </div>

    <div class="modal-overlay" id="editProfileModal">
        <div class="modal-card">
            <h3>Edit Bio 👤</h3><br>
            <textarea id="editBioInput" rows="3" placeholder="Apna Bio likhein" style="font-family: inherit; resize: none;"></textarea>
            <button class="main-btn" onclick="saveProfileData()">Save Bio</button><br><br>
            <span class="switch-link" onclick="closeModal('editProfileModal')">Cancel</span>
        </div>
    </div>

    <script>
        // 1. Firebase Configurations
        const firebaseConfig = {
            apiKey: "AIzaSyB-1zBcRW455Zd6L0JXP5QHM46fCGrXC8o",
            authDomain: "ourspace-6f129.firebaseapp.com",
            projectId: "ourspace-6f129",
            storageBucket: "ourspace-6f129.appspot.com",
            messagingSenderId: "656125817771",
            appId: "1:656125817771:web:c1c776aeaa379b037f18ee",
            measurementId: "G-K6N9EXTB5Y"
        };

        let uploadedVideoURL = ""; 

        // OFFICIAL SECURE WIDGET STREAM FLOW
        function openCloudinaryUploadWidget() {
            window.cloudinary.openUploadWidget({
                cloudName: "dcq9lsea7",
                uploadPreset: "urspace_preset",
                sources: ["local"],
                multiple: false,
                resourceType: "video"
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    uploadedVideoURL = result.info.secure_url;
                    document.getElementById("uploadWidgetTrigger").innerText = "✅ Video Selected!";
                    document.getElementById("uploadWidgetTrigger").style.color = "#00ff88";
                }
                if (error) {
                    alert("Widget Upload Error! Settings matched correctly.");
                }
            });
        }

        // Initialize Firebase safely
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUsername = "";
        let currentUID = "";
        let viewedUser = "";

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUID = user.uid;
                db.collection("users").doc(user.uid).get().then(doc => {
                    if(doc.exists) {
                        currentUsername = doc.data().username;
                        openApp();
                    } else { logout(); }
                });
            } else { toggleView('loginBox'); }
        });

        function toggleView(boxId) {
            document.getElementById("appScreen").style.display = "none";
            document.getElementById("authZoneWrapper").style.display = "flex";
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("signupBox").style.display = "none";
            document.getElementById(boxId).style.display = "block";
        }

        function openApp() {
            document.getElementById("authZoneWrapper").style.display = "none";
            document.getElementById("appScreen").style.display = "flex";
            listenToLiveGlobalFeed();
            showFeed();
        }

        function hideAllViews() {
            document.getElementById("feedView").style.display = "none";
            document.getElementById("profileView").style.display = "none";
            document.getElementById("reelsSpaceView").style.display = "none";
            document.getElementById("searchViewTab").style.display = "none";
            document.getElementById("reelVideoPlayerContainer").innerHTML = "";
        }

        function showFeed() { hideAllViews(); document.getElementById("feedView").style.display = "block"; }
        function showSearchViewTab() { hideAllViews(); document.getElementById("searchResultFeedback").innerHTML = ""; document.getElementById("searchViewTab").style.display = "block"; }
        function openModal(id) { document.getElementById(id).style.display = "flex"; }
        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        function handleSignup(e) {
            e.preventDefault();
            let u = document.getElementById("signUser").value.trim().toLowerCase();
            let em = document.getElementById("signEmail").value.trim();
            let p = document.getElementById("signPass").value;

            db.collection("users").where("username", "==", u).get().then(snapshot => {
                if(!snapshot.empty) { alert("Bhai, ye username pehle se kisi ne le rakha hai!"); } 
                else {
                    auth.createUserWithEmailAndPassword(em, p).then(cred => {
                        return db.collection("users").doc(cred.user.uid).set({ username: u, email: em, bio: "Welcome to my space." });
                    }).catch(err => alert(err.message));
                }
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            let em = document.getElementById("loginEmail").value.trim();
            let p = document.getElementById("loginPass").value;
            auth.signInWithEmailAndPassword(em, p).catch(err => alert("Email ya password galat hai bhai!"));
        }

        function logout() { auth.signOut(); }

        function addNewPost() {
            let txt = document.getElementById("postContentInput").value.trim();
            let btn = document.getElementById("publishBtn");

            if(!txt && !uploadedVideoURL) { alert("Khali post publish nahi ho sakta!"); return; }

            btn.innerText = "Publishing... Wait...";
            btn.disabled = true;

            db.collection("posts").add({
                author: currentUsername, 
                text: txt, 
                video: uploadedVideoURL, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                finalizePostCreation();
            }).catch(err => {
                alert("Firestore Error!");
                btn.innerText = "Publish";
                btn.disabled = false;
            });
        }

        function finalizePostCreation() {
            let btn = document.getElementById("publishBtn");
            btn.innerText = "Publish"; btn.disabled = false;
            uploadedVideoURL = "";
            document.getElementById("postContentInput").value = "";
            document.getElementById("uploadWidgetTrigger").innerText = "🎥 Select Video From Gallery";
            document.getElementById("uploadWidgetTrigger").style.color = "#0095f6";
            closeModal('postModal');
        }

        function listenToLiveGlobalFeed() {
            db.collection("posts").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                let container = document.getElementById("dynamicFeedContainer"); container.innerHTML = "";
                if(snapshot.empty) {
                    container.innerHTML = `<div class="no-posts-alert">Timeline khali hai bhai, pehla video dalo!</div>`;
                    return;
                }
                snapshot.forEach(doc => {
                    let p = doc.data();
                    let videoBlock = p.video ? `
                        <div class="post-video-container" onclick="toggleVideoPlayPauseState(this, '${doc.id}')">
                            <video id="vidElement_${doc.id}" src="${p.video}" autoplay muted loop playsinline></video>
                            <div class="video-status-toast" id="toast_${doc.id}">▶</div>
                        </div>` : "";

                    container.innerHTML += `
                        <div class="post">
                            <div class="post-overlay-header">
                                <b style="cursor:pointer; color:#0095f6;" onclick="navigateToUserProfile('${p.author}')">👤 @${p.author}</b>
                            </div>
                            ${videoBlock}
                            <div class="post-text-details">
                                <div class="post-caption-txt">${p.text}</div>
                                <div class="action-tray">
                                    <div class="action-tray-btn" onclick="triggerLikeHandler(this)">❤️ <span>0</span></div>
                                    <div class="action-tray-btn" onclick="alert('Comment live!')">💬 Comment</div>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        function showSpaceReels() {
            hideAllViews();
            let container = document.getElementById("reelVideoPlayerContainer");
            db.collection("posts").orderBy("timestamp", "desc").get().then(snapshot => {
                let videoPost = null;
                snapshot.forEach(doc => {
                    if(!videoPost && doc.data().video && doc.data().video !== "") { videoPost = doc.data(); }
                });
                if (!videoPost) {
                    container.innerHTML = `<div class="no-posts-alert" style="padding-top:40%;">Space khali h bhai!</div>`;
                } else {
                    container.innerHTML = `
                        <video src="${videoPost.video}" autoplay loop playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>
                        <div class="reel-overlay-info">
                            <b>👤 @${videoPost.author}</b>
                            <p>${videoPost.text || ""}</p>
                        </div>`;
                }
                document.getElementById("reelsSpaceView").style.display = "block";
            });
        }

        function navigateToUserProfile(targetUser) {
            hideAllViews(); viewedUser = targetUser;
            document.getElementById("profUsername").innerText = "@" + targetUser;
            db.collection("users").where("username", "==", targetUser).get().then(snapshot => {
                if(!snapshot.empty) { snapshot.forEach(doc => { document.getElementById("profBioText").innerText = doc.data().bio || "No bio added yet."; }); }
            });
            let actionBtn = document.getElementById("profileActionBtn");
            actionBtn.style.display = (targetUser === currentUsername) ? "inline-block" : "none";
            let grid = document.getElementById("dynamicGridContainer"); grid.innerHTML = "";
            db.collection("posts").where("author", "==", targetUser).get().then(snapshot => {
                if(snapshot.empty) { grid.innerHTML = `<div class="no-posts-alert">No Posts Yet 📸</div>`; return; }
                snapshot.forEach(doc => {
                    let p = doc.data();
                    let gridInner = p.video ? `<video src="${p.video}"></video>` : `<div style="padding:15px; font-size:12px;">📝<br>${p.text.substring(0,15)}...</div>`;
                    grid.innerHTML += `<div class="post-grid-item">${gridInner}</div>`;
                });
            });
            document.getElementById("profileView").style.display = "block";
        }

        // CONTROL VIEWS
        function viewMyOwnProfile() { navigateToUserProfile(currentUsername); }
        function openEditProfileModal() { document.getElementById("editBioInput").value = document.getElementById("profBioText").innerText; openModal('editProfileModal'); }
        function saveProfileData() {
            let newBio = document.getElementById("editBioInput").value.trim();
            db.collection("users").doc(currentUID).update({ bio: newBio }).then(() => { closeModal('editProfileModal'); navigateToUserProfile(currentUsername); });
        }

        function executeStandaloneUserSearch() {
            let query = document.getElementById("standaloneSearchInput").value.trim().toLowerCase();
            db.collection("users").where("username", "==", query).get().then(snap => {
                if(!snap.empty) { navigateToUserProfile(query); }
                else { document.getElementById("searchResultFeedback").innerHTML = `<span style="color:#ff5555; font-size:14px;">Username registry mein nahi mila!</span>`; }
            });
        }

        function toggleVideoPlayPauseState(containerEl, id) {
            let vid = document.getElementById(`vidElement_${id}`);
            let toast = document.getElementById(`toast_${id}`);
            if(vid.paused) { vid.play(); toast.innerHTML = "▶"; } else { vid.pause(); toast.innerHTML = "⏸"; }
            toast.classList.add("show-toast"); setTimeout(() => toast.classList.remove("show-toast"), 1000);
        }

        function triggerLikeHandler(el) {
            let countSpan = el.querySelector('span'); let current = parseInt(countSpan.innerText);
            if(el.style.color === "rgb(0, 149, 246)") { el.style.color = "inherit"; countSpan.innerText = current - 1; } 
            else { el.style.color = "#0095f6"; countSpan.innerText = current + 1; }
        }
    </script>
</body>
</html>
